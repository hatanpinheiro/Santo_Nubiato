# ================================================================
# ETL Bronze v4.0 — Docker Compose
# O banco PostgreSQL/PostGIS é externo. Este compose contém
# apenas o serviço da aplicação web.
# ================================================================

services:
  etl-web:
    build: .
    container_name: etl-bronze-web
    ports:
      - "5000:5000"
    volumes:
      - .:/app
      - etl-uploads:/app/uploads
    environment:
      - SECRET_KEY=etl-bronze-production-key
      - UPLOAD_FOLDER=/app/uploads
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    # Para conectar ao PostgreSQL no host, use:
    #   host: host.docker.internal  (Docker Desktop Windows/Mac)
    #   host: 172.17.0.1            (Linux)
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  etl-uploads:
    driver: local
